services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  migrate:
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supplier_app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-supplier_comparison}

  checkpoint-setup:
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supplier_app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-supplier_comparison}

  api:
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supplier_app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-supplier_comparison}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:?LLM_GATEWAY_API_KEY is required}
      SUPPLIER_MODEL_PROVIDER: ${SUPPLIER_MODEL_PROVIDER:-openai-compatible}
      SUPPLIER_MODEL_MODEL_ID: ${SUPPLIER_MODEL_MODEL_ID:?SUPPLIER_MODEL_MODEL_ID is required}
      SUPPLIER_MODEL_BASE_URL: ${SUPPLIER_MODEL_BASE_URL:?SUPPLIER_MODEL_BASE_URL is required}
      SUPPLIER_MODEL_ENVIRONMENT: ${SUPPLIER_MODEL_ENVIRONMENT:-ORGANIZER}
      SUPPLIER_MODEL_API_KEY_ENV: ${SUPPLIER_MODEL_API_KEY_ENV:-LLM_GATEWAY_API_KEY}
      SUPPLIER_DECISION_INTENT_MODEL_PROVIDER: ${SUPPLIER_DECISION_INTENT_MODEL_PROVIDER:-openai-compatible}
      SUPPLIER_DECISION_INTENT_MODEL_MODEL_ID: ${SUPPLIER_DECISION_INTENT_MODEL_MODEL_ID:-${SUPPLIER_MODEL_MODEL_ID}}
      SUPPLIER_DECISION_INTENT_MODEL_BASE_URL: ${SUPPLIER_DECISION_INTENT_MODEL_BASE_URL:-${SUPPLIER_MODEL_BASE_URL}}
      SUPPLIER_DECISION_INTENT_MODEL_API_KEY_ENV: ${SUPPLIER_DECISION_INTENT_MODEL_API_KEY_ENV:-${SUPPLIER_MODEL_API_KEY_ENV:-LLM_GATEWAY_API_KEY}}

  worker:
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supplier_app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-supplier_comparison}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:?LLM_GATEWAY_API_KEY is required}
      SUPPLIER_MODEL_PROVIDER: ${SUPPLIER_MODEL_PROVIDER:-openai-compatible}
      SUPPLIER_MODEL_MODEL_ID: ${SUPPLIER_MODEL_MODEL_ID:?SUPPLIER_MODEL_MODEL_ID is required}
      SUPPLIER_MODEL_BASE_URL: ${SUPPLIER_MODEL_BASE_URL:?SUPPLIER_MODEL_BASE_URL is required}
      SUPPLIER_MODEL_ENVIRONMENT: ${SUPPLIER_MODEL_ENVIRONMENT:-ORGANIZER}
      SUPPLIER_MODEL_API_KEY_ENV: ${SUPPLIER_MODEL_API_KEY_ENV:-LLM_GATEWAY_API_KEY}
      SUPPLIER_CONVERSATION_MODEL_PROVIDER: ${SUPPLIER_CONVERSATION_MODEL_PROVIDER:-openai-compatible}
      SUPPLIER_CONVERSATION_MODEL_MODEL_ID: ${SUPPLIER_CONVERSATION_MODEL_MODEL_ID:-${SUPPLIER_MODEL_MODEL_ID}}
      SUPPLIER_CONVERSATION_MODEL_BASE_URL: ${SUPPLIER_CONVERSATION_MODEL_BASE_URL:-${SUPPLIER_MODEL_BASE_URL}}
      SUPPLIER_CONVERSATION_MODEL_API_KEY_ENV: ${SUPPLIER_CONVERSATION_MODEL_API_KEY_ENV:-${SUPPLIER_MODEL_API_KEY_ENV:-LLM_GATEWAY_API_KEY}}

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
