name: supplier-comparison

# Shared by API and worker: --env-file performs interpolation; it does NOT
# automatically inject these variables into a container.
x-runtime-environment: &runtime-environment
  SUPPLIER_MODEL_TIMEOUT_SECONDS: ${SUPPLIER_MODEL_TIMEOUT_SECONDS:-60}
  SUPPLIER_MODEL_MAX_ATTEMPTS: ${SUPPLIER_MODEL_MAX_ATTEMPTS:-3}
  SUPPLIER_MODEL_ENABLE_THINKING: ${SUPPLIER_MODEL_ENABLE_THINKING:-false}
  SUPPLIER_MODEL_MAX_TOKENS: ${SUPPLIER_MODEL_MAX_TOKENS:-8192}
  SUPPLIER_MODEL_RETRY_BACKOFF_SECONDS: ${SUPPLIER_MODEL_RETRY_BACKOFF_SECONDS:-0.25}
  SUPPLIER_MODEL_RETRY_JITTER_SECONDS: ${SUPPLIER_MODEL_RETRY_JITTER_SECONDS:-0.25}
  SUPPLIER_MODEL_MAX_RETRY_DELAY_SECONDS: ${SUPPLIER_MODEL_MAX_RETRY_DELAY_SECONDS:-30}
  SUPPLIER_REQUIREMENT_MODEL_MODEL_ID: ${SUPPLIER_REQUIREMENT_MODEL_MODEL_ID:-}
  SUPPLIER_REQUIREMENT_MODEL_BASE_URL: ${SUPPLIER_REQUIREMENT_MODEL_BASE_URL:-}
  SUPPLIER_REQUIREMENT_MODEL_API_KEY_ENV: ${SUPPLIER_REQUIREMENT_MODEL_API_KEY_ENV:-}
  SUPPLIER_REQUIREMENT_MODEL_TIMEOUT_SECONDS: ${SUPPLIER_REQUIREMENT_MODEL_TIMEOUT_SECONDS:-180}
  SUPPLIER_REQUIREMENT_MODEL_MAX_ATTEMPTS: ${SUPPLIER_REQUIREMENT_MODEL_MAX_ATTEMPTS:-2}
  SUPPLIER_REQUIREMENT_MODEL_MAX_TOKENS: ${SUPPLIER_REQUIREMENT_MODEL_MAX_TOKENS:-4096}
  SUPPLIER_SUMMARY_MODEL_MODEL_ID: ${SUPPLIER_SUMMARY_MODEL_MODEL_ID:-}
  SUPPLIER_SUMMARY_MODEL_BASE_URL: ${SUPPLIER_SUMMARY_MODEL_BASE_URL:-}
  SUPPLIER_SUMMARY_MODEL_API_KEY_ENV: ${SUPPLIER_SUMMARY_MODEL_API_KEY_ENV:-}
  SUPPLIER_SUMMARY_MODEL_TIMEOUT_SECONDS: ${SUPPLIER_SUMMARY_MODEL_TIMEOUT_SECONDS:-60}
  SUPPLIER_SUMMARY_MODEL_MAX_ATTEMPTS: ${SUPPLIER_SUMMARY_MODEL_MAX_ATTEMPTS:-2}
  SUPPLIER_EXPLANATION_MODEL_ID: ${SUPPLIER_EXPLANATION_MODEL_ID:-}
  SUPPLIER_EXPLANATION_BASE_URL: ${SUPPLIER_EXPLANATION_BASE_URL:-}
  SUPPLIER_EXPLANATION_API_KEY_ENV: ${SUPPLIER_EXPLANATION_API_KEY_ENV:-}
  SUPPLIER_EXPLANATION_TIMEOUT_SECONDS: ${SUPPLIER_EXPLANATION_TIMEOUT_SECONDS:-60}
  SUPPLIER_EXPLANATION_MAX_ATTEMPTS: ${SUPPLIER_EXPLANATION_MAX_ATTEMPTS:-2}
  SUPPLIER_EXPLANATION_MAX_TOKENS: ${SUPPLIER_EXPLANATION_MAX_TOKENS:-4096}
  SUPPLIER_AGENT_ENABLED: ${SUPPLIER_AGENT_ENABLED:-false}
  SUPPLIER_AGENT_MODEL_ID: ${SUPPLIER_AGENT_MODEL_ID:-}
  SUPPLIER_AGENT_BASE_URL: ${SUPPLIER_AGENT_BASE_URL:-}
  SUPPLIER_AGENT_API_KEY_ENV: ${SUPPLIER_AGENT_API_KEY_ENV:-}
  SUPPLIER_AGENT_TIMEOUT_SECONDS: ${SUPPLIER_AGENT_TIMEOUT_SECONDS:-30}
  SUPPLIER_AGENT_MAX_TOKENS: ${SUPPLIER_AGENT_MAX_TOKENS:-1024}
  SUPPLIER_AGENT_MAX_MODEL_CALLS: ${SUPPLIER_AGENT_MAX_MODEL_CALLS:-8}
  SUPPLIER_AGENT_MAX_TOOL_CALLS: ${SUPPLIER_AGENT_MAX_TOOL_CALLS:-10}
  SUPPLIER_AGENT_MAX_SECONDS: ${SUPPLIER_AGENT_MAX_SECONDS:-90}
  SUPPLIER_AGENT_POLICY_MAX_RETRIES: ${SUPPLIER_AGENT_POLICY_MAX_RETRIES:-2}
  SUPPLIER_CONVERSATION_JOB_STALE_SECONDS: ${SUPPLIER_CONVERSATION_JOB_STALE_SECONDS:-120}
  SUPPLIER_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${SUPPLIER_WORKER_HEARTBEAT_INTERVAL_SECONDS:-5}
  SUPPLIER_WORKER_HEARTBEAT_STALE_SECONDS: ${SUPPLIER_WORKER_HEARTBEAT_STALE_SECONDS:-20}
  SUPPLIER_HISTORY_DATASET_VERSION: ${SUPPLIER_HISTORY_DATASET_VERSION:-2026-08-06-v1}

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_DB: ${POSTGRES_DB:-supplier_comparison}
      POSTGRES_USER: ${POSTGRES_USER:-supplier_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supplier_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supplier_app}:${POSTGRES_PASSWORD:-supplier_dev_password}@postgres:5432/${POSTGRES_DB:-supplier_comparison}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"

  checkpoint-setup:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supplier_app}:${POSTGRES_PASSWORD:-supplier_dev_password}@postgres:5432/${POSTGRES_DB:-supplier_comparison}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "supplier_comparison.checkpoints", "setup"]
    restart: "no"

  api:
    build:
      context: .
    environment:
      <<: *runtime-environment
      TZ: UTC
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supplier_app}:${POSTGRES_PASSWORD:-supplier_dev_password}@postgres:5432/${POSTGRES_DB:-supplier_comparison}
      QUOTE_STORAGE_PATH: /var/lib/supplier-comparison/quotes
      POLICY_UPLOAD_STORAGE_PATH: /var/lib/supplier-comparison/policy-uploads
      POLICY_UPLOAD_MAX_BYTES: ${POLICY_UPLOAD_MAX_BYTES:-5242880}
      POLICY_UPLOAD_MAX_PDF_PAGES: ${POLICY_UPLOAD_MAX_PDF_PAGES:-50}
      POLICY_UPLOAD_MAX_EXTRACTED_CHARACTERS: ${POLICY_UPLOAD_MAX_EXTRACTED_CHARACTERS:-200000}
      SUPPLIER_POLICY_ROOT: /app/data/policies
      TEST_USER_ID: ${TEST_USER_ID:-local-test-user}
      SUPPLIER_MODEL_PROVIDER: ${SUPPLIER_MODEL_PROVIDER:-}
      SUPPLIER_MODEL_MODEL_ID: ${SUPPLIER_MODEL_MODEL_ID:-}
      SUPPLIER_MODEL_BASE_URL: ${SUPPLIER_MODEL_BASE_URL:-}
      SUPPLIER_MODEL_ENVIRONMENT: ${SUPPLIER_MODEL_ENVIRONMENT:-LOCAL}
      SUPPLIER_MODEL_API_KEY_ENV: ${SUPPLIER_MODEL_API_KEY_ENV:-QQFARM_SILICONFLOW_API_KEY}
      SUPPLIER_DECISION_INTENT_MODEL_PROVIDER: ${SUPPLIER_DECISION_INTENT_MODEL_PROVIDER:-}
      SUPPLIER_DECISION_INTENT_MODEL_MODEL_ID: ${SUPPLIER_DECISION_INTENT_MODEL_MODEL_ID:-}
      SUPPLIER_DECISION_INTENT_MODEL_BASE_URL: ${SUPPLIER_DECISION_INTENT_MODEL_BASE_URL:-}
      SUPPLIER_DECISION_INTENT_MODEL_API_KEY_ENV: ${SUPPLIER_DECISION_INTENT_MODEL_API_KEY_ENV:-${SUPPLIER_MODEL_API_KEY_ENV:-QQFARM_SILICONFLOW_API_KEY}}
      SUPPLIER_DECISION_INTENT_MODEL_TIMEOUT_SECONDS: ${SUPPLIER_DECISION_INTENT_MODEL_TIMEOUT_SECONDS:-60}
      SUPPLIER_DECISION_INTENT_MODEL_MAX_ATTEMPTS: ${SUPPLIER_DECISION_INTENT_MODEL_MAX_ATTEMPTS:-2}
      SUPPLIER_EMBEDDING_PROVIDER: ${SUPPLIER_EMBEDDING_PROVIDER:-siliconflow}
      SUPPLIER_EMBEDDING_MODEL_ID: ${SUPPLIER_EMBEDDING_MODEL_ID:-BAAI/bge-m3}
      SUPPLIER_EMBEDDING_BASE_URL: ${SUPPLIER_EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      SUPPLIER_EMBEDDING_API_KEY_ENV: ${SUPPLIER_EMBEDDING_API_KEY_ENV:-QQFARM_SILICONFLOW_API_KEY}
      SUPPLIER_EMBEDDING_DIMENSION: ${SUPPLIER_EMBEDDING_DIMENSION:-1024}
      SUPPLIER_EMBEDDING_TIMEOUT_SECONDS: ${SUPPLIER_EMBEDDING_TIMEOUT_SECONDS:-30}
      SUPPLIER_EMBEDDING_MAX_ATTEMPTS: ${SUPPLIER_EMBEDDING_MAX_ATTEMPTS:-2}
      SUPPLIER_EMBEDDING_BATCH_SIZE: ${SUPPLIER_EMBEDDING_BATCH_SIZE:-16}
      SUPPLIER_RERANK_PROVIDER: ${SUPPLIER_RERANK_PROVIDER:-siliconflow}
      SUPPLIER_RERANK_MODEL_ID: ${SUPPLIER_RERANK_MODEL_ID:-BAAI/bge-reranker-v2-m3}
      SUPPLIER_RERANK_BASE_URL: ${SUPPLIER_RERANK_BASE_URL:-https://api.siliconflow.cn/v1}
      SUPPLIER_RERANK_API_KEY_ENV: ${SUPPLIER_RERANK_API_KEY_ENV:-QQFARM_SILICONFLOW_API_KEY}
      SUPPLIER_RERANK_TIMEOUT_SECONDS: ${SUPPLIER_RERANK_TIMEOUT_SECONDS:-30}
      SUPPLIER_RERANK_MAX_ATTEMPTS: ${SUPPLIER_RERANK_MAX_ATTEMPTS:-2}
      QQFARM_SILICONFLOW_API_KEY: ${QQFARM_SILICONFLOW_API_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - quote_files:/var/lib/supplier-comparison/quotes
      - policy_files:/var/lib/supplier-comparison/policy-uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      checkpoint-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
    environment:
      <<: *runtime-environment
      TZ: UTC
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supplier_app}:${POSTGRES_PASSWORD:-supplier_dev_password}@postgres:5432/${POSTGRES_DB:-supplier_comparison}
      QUOTE_STORAGE_PATH: /var/lib/supplier-comparison/quotes
      SUPPLIER_POLICY_ROOT: /app/data/policies
      TEST_USER_ID: ${TEST_USER_ID:-local-test-user}
      SUPPLIER_MODEL_PROVIDER: ${SUPPLIER_MODEL_PROVIDER:-}
      SUPPLIER_MODEL_MODEL_ID: ${SUPPLIER_MODEL_MODEL_ID:-}
      SUPPLIER_MODEL_BASE_URL: ${SUPPLIER_MODEL_BASE_URL:-}
      SUPPLIER_MODEL_ENVIRONMENT: ${SUPPLIER_MODEL_ENVIRONMENT:-LOCAL}
      SUPPLIER_MODEL_API_KEY_ENV: ${SUPPLIER_MODEL_API_KEY_ENV:-QQFARM_SILICONFLOW_API_KEY}
      QQFARM_SILICONFLOW_API_KEY: ${QQFARM_SILICONFLOW_API_KEY:-}
      SUPPLIER_CONVERSATION_MODEL_PROVIDER: ${SUPPLIER_CONVERSATION_MODEL_PROVIDER:-}
      SUPPLIER_CONVERSATION_MODEL_MODEL_ID: ${SUPPLIER_CONVERSATION_MODEL_MODEL_ID:-}
      SUPPLIER_CONVERSATION_MODEL_BASE_URL: ${SUPPLIER_CONVERSATION_MODEL_BASE_URL:-}
      SUPPLIER_CONVERSATION_MODEL_API_KEY_ENV: ${SUPPLIER_CONVERSATION_MODEL_API_KEY_ENV:-${SUPPLIER_MODEL_API_KEY_ENV:-QQFARM_SILICONFLOW_API_KEY}}
      SUPPLIER_CONVERSATION_MODEL_TIMEOUT_SECONDS: ${SUPPLIER_CONVERSATION_MODEL_TIMEOUT_SECONDS:-60}
      SUPPLIER_CONVERSATION_MODEL_MAX_ATTEMPTS: ${SUPPLIER_CONVERSATION_MODEL_MAX_ATTEMPTS:-2}
      SUPPLIER_EMBEDDING_PROVIDER: ${SUPPLIER_EMBEDDING_PROVIDER:-siliconflow}
      SUPPLIER_EMBEDDING_MODEL_ID: ${SUPPLIER_EMBEDDING_MODEL_ID:-BAAI/bge-m3}
      SUPPLIER_EMBEDDING_BASE_URL: ${SUPPLIER_EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      SUPPLIER_EMBEDDING_API_KEY_ENV: ${SUPPLIER_EMBEDDING_API_KEY_ENV:-QQFARM_SILICONFLOW_API_KEY}
      SUPPLIER_EMBEDDING_DIMENSION: ${SUPPLIER_EMBEDDING_DIMENSION:-1024}
      SUPPLIER_EMBEDDING_TIMEOUT_SECONDS: ${SUPPLIER_EMBEDDING_TIMEOUT_SECONDS:-30}
      SUPPLIER_EMBEDDING_MAX_ATTEMPTS: ${SUPPLIER_EMBEDDING_MAX_ATTEMPTS:-2}
      SUPPLIER_EMBEDDING_BATCH_SIZE: ${SUPPLIER_EMBEDDING_BATCH_SIZE:-16}
      SUPPLIER_RERANK_PROVIDER: ${SUPPLIER_RERANK_PROVIDER:-siliconflow}
      SUPPLIER_RERANK_MODEL_ID: ${SUPPLIER_RERANK_MODEL_ID:-BAAI/bge-reranker-v2-m3}
      SUPPLIER_RERANK_BASE_URL: ${SUPPLIER_RERANK_BASE_URL:-https://api.siliconflow.cn/v1}
      SUPPLIER_RERANK_API_KEY_ENV: ${SUPPLIER_RERANK_API_KEY_ENV:-QQFARM_SILICONFLOW_API_KEY}
      SUPPLIER_RERANK_TIMEOUT_SECONDS: ${SUPPLIER_RERANK_TIMEOUT_SECONDS:-30}
      SUPPLIER_RERANK_MAX_ATTEMPTS: ${SUPPLIER_RERANK_MAX_ATTEMPTS:-2}
      SUPPLIER_PDF_OCR_ENABLED: ${SUPPLIER_PDF_OCR_ENABLED:-false}
    volumes:
      - quote_files:/var/lib/supplier-comparison/quotes
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      checkpoint-setup:
        condition: service_completed_successfully
    command: ["python", "-m", "supplier_comparison.worker", "run-loop", "--poll-interval", "1"]
    restart: unless-stopped

volumes:
  database_data:
  quote_files:
  policy_files:
