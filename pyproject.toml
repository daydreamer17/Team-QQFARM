[project]
name = "supplier-comparison"
version = "0.1.0"
description = "Supplier quote parsing, extraction adapter, and evidence boundary"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=12,<13",
    "pdfplumber>=0.11,<1",
    "pypdfium2>=5,<6",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
